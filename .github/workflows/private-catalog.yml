name: Generate encrypted private catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [config/private-preview-public.pem]

permissions:
  contents: read

concurrency:
  group: viewport-catalog-trial
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Generate encrypted catalog using existing repository secrets
        env:
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          STREAMING_AVAILABILITY_API_KEY: ${{ secrets.STREAMING_AVAILABILITY_API_KEY }}
        run: node scripts/catalog-trial/preview.ts --encrypted
      - name: Transfer ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: viewport-private-catalog-encrypted
          path: catalog-trial-output/catalog.encrypted.json
          if-no-files-found: error
          retention-days: 1
